# Portfolios for the market-making strategy (prod/ui/portfolio.conf).
# One portfolio per underlying keeps risk and START/STOP control independent.
# Strat= must match the name registered in main.cpp ("strat_1").
# 901 selects the client config to load in initialize() (PRO vs client orders).
101:PORTFOLIO_CONFIG:Strat=strat_1
101:BANKNIFTY25JULFUT

102:PORTFOLIO_CONFIG:Strat=strat_1
102:NIFTY25JULFUT
